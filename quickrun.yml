# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Audiola
description: "Audio-Studio: Stems trennen, arrangieren, einsingen, mastern — die plattformübergreifende Avalonia-Fassung."
icon: docs/assets/logo.png
docs: https://audiola.de

requires:
  - tool: dotnet
    version: ">=10.0"
    install: https://dotnet.microsoft.com/download

setup:
  # Nur die Desktop-App wiederherstellen. Ein "dotnet restore" ohne Ziel nimmt Audiola.sln,
  # und die enthält zwei WPF-Projekte (net10.0-windows) sowie einen Aspire-AppHost mit eigenem
  # SDK — beides braucht diese App nicht, beides kann auf einem fremden Rechner scheitern.
  - run: dotnet restore src/Audiola.Avalonia

tasks:
  - name: audiola
    run: dotnet run --project src/Audiola.Avalonia --configuration Release
