name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 0.1.1)
        required: true
        default: 0.1.0

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.product }} · ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: Audiola
            project: src/Audiola.Avalonia/Audiola.Avalonia.csproj
            executable: Audiola
            runner: windows-2025
            rid: win-x64
            platform: win-x64
            channel: audiola-win-x64
            installer_pattern: "*Setup*.exe"
            download_suffix: Setup.exe
          - product: Audiola
            project: src/Audiola.Avalonia/Audiola.Avalonia.csproj
            executable: Audiola
            runner: macos-14
            rid: osx-arm64
            platform: osx-arm64
            channel: audiola-osx-arm64
            installer_pattern: "*.pkg"
            download_suffix: Setup.pkg
          - product: Audiola
            project: src/Audiola.Avalonia/Audiola.Avalonia.csproj
            executable: Audiola
            runner: macos-15-intel
            rid: osx-x64
            platform: osx-x64
            channel: audiola-osx-x64
            installer_pattern: "*.pkg"
            download_suffix: Setup.pkg
          - product: Audiola
            project: src/Audiola.Avalonia/Audiola.Avalonia.csproj
            executable: Audiola
            runner: ubuntu-24.04
            rid: linux-x64
            platform: linux-x64
            channel: audiola-linux-x64
            installer_pattern: "*.AppImage"
            download_suffix: AppImage
          - product: Singola
            project: src/Singola.Avalonia/Singola.Avalonia.csproj
            executable: Singola
            runner: windows-2025
            rid: win-x64
            platform: win-x64
            channel: singola-win-x64
            installer_pattern: "*Setup*.exe"
            download_suffix: Setup.exe
          - product: Singola
            project: src/Singola.Avalonia/Singola.Avalonia.csproj
            executable: Singola
            runner: macos-14
            rid: osx-arm64
            platform: osx-arm64
            channel: singola-osx-arm64
            installer_pattern: "*.pkg"
            download_suffix: Setup.pkg
          - product: Singola
            project: src/Singola.Avalonia/Singola.Avalonia.csproj
            executable: Singola
            runner: macos-15-intel
            rid: osx-x64
            platform: osx-x64
            channel: singola-osx-x64
            installer_pattern: "*.pkg"
            download_suffix: Setup.pkg
          - product: Singola
            project: src/Singola.Avalonia/Singola.Avalonia.csproj
            executable: Singola
            runner: ubuntu-24.04
            rid: linux-x64
            platform: linux-x64
            channel: singola-linux-x64
            installer_pattern: "*.AppImage"
            download_suffix: AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained application
        shell: bash
        run: |
          dotnet publish "${{ matrix.project }}" \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            --property:PublishSingleFile=false \
            --property:Version="${{ steps.version.outputs.version }}" \
            --output publish/${{ matrix.product }}/${{ matrix.platform }}

      - name: Bundle FFmpeg for cross-platform export
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        shell: bash
        run: |
          npm install --no-save ffmpeg-static
          ffmpeg="$(node -p "require('ffmpeg-static')")"
          test -x "$ffmpeg"
          cp "$ffmpeg" "publish/${{ matrix.product }}/${{ matrix.platform }}/ffmpeg"
          chmod +x "publish/${{ matrix.product }}/${{ matrix.platform }}/ffmpeg"

      - name: Install Velopack CLI
        shell: bash
        run: |
          dotnet tool install --global vpk --version 0.0.1298
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Create platform package and product update feed
        shell: bash
        run: |
          main_exe="${{ matrix.executable }}"
          if [[ "${{ matrix.rid }}" == win-* ]]; then main_exe="$main_exe.exe"; fi
          output_dir="release/${{ matrix.product }}/${{ matrix.platform }}"
          mkdir -p "$output_dir"
          vpk pack \
            --packId "${{ matrix.product }}" \
            --packTitle "${{ matrix.product }}" \
            --packAuthors "Florian Gilde" \
            --packVersion "${{ steps.version.outputs.version }}" \
            --packDir "publish/${{ matrix.product }}/${{ matrix.platform }}" \
            --mainExe "$main_exe" \
            --channel "${{ matrix.channel }}" \
            --outputDir "$output_dir"

          installer=$(find "$output_dir" -maxdepth 1 -type f -iname "${{ matrix.installer_pattern }}" -print -quit)
          test -n "$installer"
          mv "$installer" "$output_dir/${{ matrix.product }}-${{ matrix.platform }}-${{ matrix.download_suffix }}"

      - name: Upload package and update feed
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.product }}-${{ matrix.platform }}
          path: release/${{ matrix.product }}/${{ matrix.platform }}/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Audiola ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
